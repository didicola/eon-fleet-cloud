name: EON Fleet Pipeline

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, 24/7 on GitHub's cloud
  workflow_dispatch:          # manual trigger
    inputs:
      min_live:
        description: "Force-mint test: override EON_MIN_LIVE (default 6)"
        required: false
        default: ""
  repository_dispatch:        # primary 10-min tick: eon-fleet-syncer CF cron -> this
    types: [fleet-mint-now]
  push:
    branches: [main]

permissions:
  contents: write

# Serialize runs: overlapping runs push-race and silently drop the registry
# (no registry commit has landed since Sep 2). Queue instead of overlap.
concurrency:
  group: fleet-pipeline
  cancel-in-progress: false

jobs:
  fleet-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (for cf-temp-account minting)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install requests
          go install github.com/PeronGH/cf-temp-account@latest 2>/dev/null || echo "go install note"
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Mint + deploy fresh workers
        env:
          EON_TARGET: "3"
          EON_MIN_LIVE: ${{ inputs.min_live || '6' }}
          EON_DAILY_MINT_CAP: "120"
        run: |
          python3 scripts/fleet-mint.py 2>&1 | tail -30 || echo "mint exit $?"

      - name: Ghost keeper (token lane — durable, no browser)
        # The durable lane. EON_CF_TOKEN is a scoped API token on the mother
        # identity: it enumerates every account the user belongs to and
        # (re)deploys the ghost worker where it is missing or not answering.
        # This replaces the claim-session lane below, which is measured dead
        # (dashboard session is TLS-fingerprint bound; Turnstile rejects
        # WARP/datacenter/WebDriver clients; stored mint tokens all 401).
        env:
          EON_CF_TOKEN: ${{ secrets.EON_CF_TOKEN }}
          EON_KEEPER_OUT: scripts/fleet-keeper.json
          EON_KEEPER_REG: scripts/cloud_rounds.json
        run: |
          python3 scripts/fleet-keeper.py 2>&1 | tail -30 || echo "keeper exit $?"

      - name: Claim fresh mints (cloud mother session, WARP egress)
        # DEAD LANE (2026-10-20): kept only so an existing EON_CF_SESSION can
        # still be tried. Skips itself when the secret is absent — which is the
        # intended state now that the token keeper above owns durability.

        env:
          EON_CF_SESSION: ${{ secrets.EON_CF_SESSION }}
        run: |
          if [ -z "$EON_CF_SESSION" ]; then
            echo "[claim] EON_CF_SESSION secret not set — session claim skipped"
            exit 0
          fi
          pip install playwright 2>&1 | tail -1 || echo "playwright pip note"
          python3 -m playwright install firefox --with-deps 2>&1 | tail -2 || echo "firefox install note"
          # Same egress class as the ubuntu claim lane: free Cloudflare WARP.
          sudo systemctl start warp-svc 2>/dev/null || true
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq curl gnupg xvfb >/dev/null 2>&1 || true
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg 2>/dev/null \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg 2>/dev/null || true
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo $VERSION_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null 2>&1 || true
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq cloudflare-warp >/dev/null 2>&1 || true
          sudo systemctl start warp-svc 2>/dev/null || sudo service warp-svc start 2>/dev/null || true
          sudo warp-cli --accept-tos registration new >/dev/null 2>&1 || true
          sudo warp-cli --accept-tos mode warp >/dev/null 2>&1 || true
          sudo warp-cli --accept-tos connect >/dev/null 2>&1 || true
          sleep 6
          curl -s https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -E '^(ip|warp)=' || true
          # Headful Firefox under Xvfb mirrors the box (headless browsers are
          # what Cloudflare's security check rejects). Falls back to headless.
          if command -v xvfb-run >/dev/null 2>&1; then
            CLAIM_HEADLESS=0 xvfb-run -a python3 scripts/fleet-claim-session.py 2>&1 | tail -20 || echo "claim exit $?"
          else
            python3 scripts/fleet-claim-session.py 2>&1 | tail -20 || echo "claim exit $?"
          fi

      - name: Run fleet cloud pipeline
        env:
          EON_TG_BOT: ${{ secrets.EON_TG_BOT }}
          EON_TG_CHAT: ${{ secrets.EON_TG_CHAT }}
          EON_TG_CHANNEL: ${{ secrets.EON_TG_CHANNEL }}
          EON_DASHBOARD_URL: ${{ secrets.EON_DASHBOARD_URL }}
          EON_DASHBOARD_SECRET: ${{ secrets.EON_DASHBOARD_SECRET }}
          EON_CF_TOKEN: ${{ secrets.EON_CF_TOKEN }}
          EON_CF_ACCOUNT: ${{ secrets.EON_CF_ACCOUNT }}
        run: |
          # Health-check the fleet + push registry to dashboard + Telegram
          python3 scripts/fleet-cloud.py 2>&1 | tail -40 || echo "fleet-cloud exit $?"

      - name: Commit updated registry
        run: |
          git config user.name "eon-fleet-bot"
          git config user.email "eon-fleet-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || {
            git commit -m "fleet registry update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main 2>&1 | tail -2 || true
            git push origin main 2>&1 | tail -3 || echo "push note (concurrent run)"
          }